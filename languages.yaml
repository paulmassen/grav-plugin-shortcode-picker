en:
  PLUGIN_SHORTCODE_PICKER:
    BUTTON_LABEL: "Insert shortcode"
    MODAL_TITLE: "Insert a shortcode"
    SEARCH: "Search a shortcode"
    LIST: "Available shortcodes"
    EMPTY: "No shortcode matches."
    PAIRED: "Wraps content ([name]…[/name])"
    PARAMS: "Attributes (optional)"
    PARAMS_HELP: "Example: style=\"info\" or class=\"my-style\""
    CONTENT: "content"
    PREVIEW: "Preview"
    CODE: "Code to insert"
    HAS_PREVIEW: "has a preview"
    NO_PREVIEW: "No preview for this shortcode."
    PREVIEW_ALT: "Example of the rendered shortcode"
    EXAMPLE_NOTE: "The example below is inserted as is."
    INSERT: "Insert"
    CANCEL: "Cancel"
    SETTINGS:
      LIST_SECTION: "Shortcode list"
      HIDDEN: "Hidden shortcodes"
      HIDDEN_HELP: "These shortcodes are left out of the picker list. They still work in page content."
      PREVIEWS_SECTION: "Previews"
      PREVIEWS_TEXT: "Show authors what a shortcode looks like before they insert it: a screenshot or an animated GIF, a short description and a ready-made example."
      PREVIEWS: "Shortcode previews"
      PREVIEWS_HELP: "One entry per shortcode. Shortcodes without an entry are listed without a preview."
      ADD_PREVIEW: "Add a preview"
      SHORTCODE: "Shortcode"
      SHORTCODE_HELP: "The shortcode this preview describes. Only shortcodes registered on the site are listed."
      IMAGE: "Screenshot or GIF"
      IMAGE_HELP: "PNG, JPEG, GIF, WebP or AVIF, saved in user/media/shortcode-picker. Shown in the picker when the shortcode is selected. Around 800 pixels wide is enough."
      DESCRIPTION: "Description"
      DESCRIPTION_HELP: "One or two sentences shown under the image, such as what the shortcode does and when to use it."
      EXAMPLE: "Example to insert"
      EXAMPLE_HELP: "Full shortcode inserted when this shortcode is picked, with its real attributes and closing tag. Leave empty to build it with the attribute and Wraps content options."

fr:
  PLUGIN_SHORTCODE_PICKER:
    BUTTON_LABEL: "Insérer un shortcode"
    MODAL_TITLE: "Insérer un shortcode"
    SEARCH: "Rechercher un shortcode"
    LIST: "Shortcodes disponibles"
    EMPTY: "Aucun shortcode ne correspond."
    PAIRED: "Encadre du contenu ([nom]…[/nom])"
    PARAMS: "Attributs (facultatif)"
    PARAMS_HELP: "Exemple : style=\"info\" ou class=\"mon-style\""
    CONTENT: "contenu"
    PREVIEW: "Aperçu"
    CODE: "Code inséré"
    HAS_PREVIEW: "avec aperçu"
    NO_PREVIEW: "Pas d’aperçu pour ce shortcode."
    PREVIEW_ALT: "Exemple de rendu du shortcode"
    EXAMPLE_NOTE: "L’exemple ci-dessous est inséré tel quel."
    INSERT: "Insérer"
    CANCEL: "Annuler"
    SETTINGS:
      LIST_SECTION: "Liste des shortcodes"
      HIDDEN: "Shortcodes masqués"
      HIDDEN_HELP: "Ces shortcodes n’apparaissent pas dans la liste du sélecteur. Ils continuent de fonctionner dans le contenu des pages."
      PREVIEWS_SECTION: "Aperçus"
      PREVIEWS_TEXT: "Montrez aux personnes qui rédigent à quoi ressemble un shortcode avant de l’insérer : une capture d’écran ou un GIF animé, une courte description et un exemple prêt à l’emploi."
      PREVIEWS: "Aperçus des shortcodes"
      PREVIEWS_HELP: "Une entrée par shortcode. Les shortcodes sans entrée sont listés sans aperçu."
      ADD_PREVIEW: "Ajouter un aperçu"
      SHORTCODE: "Shortcode"
      SHORTCODE_HELP: "Le shortcode décrit par cet aperçu. Seuls les shortcodes enregistrés sur le site sont proposés."
      IMAGE: "Capture d’écran ou GIF"
      IMAGE_HELP: "PNG, JPEG, GIF, WebP ou AVIF, enregistré dans user/media/shortcode-picker. Affiché dans le sélecteur lorsque le shortcode est choisi. Une largeur d’environ 800 pixels suffit."
      DESCRIPTION: "Description"
      DESCRIPTION_HELP: "Une ou deux phrases affichées sous l’image : ce que fait le shortcode et quand l’utiliser."
      EXAMPLE: "Exemple à insérer"
      EXAMPLE_HELP: "Shortcode complet inséré lorsque ce shortcode est choisi, avec ses vrais attributs et sa balise de fermeture. Laisser vide pour le construire avec les options Attributs et Encadre du contenu."
